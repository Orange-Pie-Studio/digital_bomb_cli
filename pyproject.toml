[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital_bomb"
version = "0.3.0"
description = ""
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "Faker>=5.0.0",
    "packaging>=24.0",
    "requests>=2.33.1",
    "rich>=14.0.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=0.18.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pyinstaller>=6.0.0",
]

[tool.bumpversion]
current_version = "0.3.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.pytest.ini_options]
addopts = "--cov=src/digital_bomb --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
